[package]
name = "handkit-fframes"
version = "0.1.0"
edition = "2024"
description = "Handkit hands in fframes videos: load the hand mesh into fframes::three_d and pose it."

[dependencies]
fframes_three_d = "1.3"
handkit-core = { version = "0.1.0", path = "../handkit-core" }
handkit-mesh = { version = "0.1.0", path = "../handkit-mesh" }
rayon = "1.10"
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
