[dependencies.ash]
version = "0.38.0"
optional = true

[dependencies.fframes]
version = "1.3.0"

[dependencies.foreign-types-shared]
version = "0.3.1"

[dependencies.metal-rs]
version = "0.32.0"
optional = true
package = "metal"

[dependencies.skia-safe]
version = "0.153.3"
features = ["svg"]

[dependencies.thingbuf]
version = "0.1.6"

[dependencies.uuid]
version = "1.12.1"

[dependencies.wgpu]
version = "30"
